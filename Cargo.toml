[package]
name = "devicenet-identifier-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "DeviceNet trace analyzer for 11-bit CAN identifiers and explicit messaging"
repository = "https://github.com/AnlangA/devicenet-identifier-analyzer"

[[bin]]
name = "devicenet-identifier-analyzer"
path = "src/main.rs"
bench = false

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt", "time"] }
zai-rs = "0.6.0"
base64 = "0.22"
ring = "0.17"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
