[package]
name = "devicenet-identifier-analyzer"
version = "0.1.0"
edition = "2024"
description = "DeviceNet 11-bit CAN identifier group analyzer"

[[bin]]
name = "devicenet-identifier-analyzer"
path = "src/main.rs"
bench = false

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt", "time"] }
zai-rs = "0.6.0"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
